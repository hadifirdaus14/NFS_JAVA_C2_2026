<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 Rest Basics</title>
</head>
<body>
<h1>Course Offerings</h1>

<button id="loadButton">Load Course Offerings</button>

<p id="statusText">No request sent yet.</p>

<ul id="courseList"></ul>

<h2>Create Course</h2>

<form id="createForm">
    <div>
        <label for="courseTitle">Course Title</label>
        <input id="courseTitle" name="courseTitle" type="text">
    </div>

    <div>
        <label for="instructorName">Instructor Name</label>
        <input id="instructorName" name="instructorName" type="text">
    </div>

    <div>
        <label for="startDate">Start Date</label>
        <input id="startDate" name="startDate" type="date">
    </div>

    <div>
        <label for="capacity">Capacity</label>
        <input id="capacity" name="capacity" type="number">
    </div>

    <button type="submit">Create</button>
</form>

<script src="app.js"></script>
</body>
</html>
