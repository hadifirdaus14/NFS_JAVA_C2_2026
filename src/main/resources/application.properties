server.port=8080

# To run the application with a different MongoDB configuration, you can set the following environment variables before starting the application:
# export MONGODB_HOST=localhost
# export MONGODB_PORT=27017
# export MONGODB_DATABASE=asset_tracker_db
# export MONGODB_AUTH_DATABASE=asset_tracker_db
# export MONGODB_USERNAME=your_user
# export MONGODB_PASSWORD=your_pass

spring.data.mongodb.auto-index-creation=true

# 1. Connect directly to your local MongoDB and specify the support_desk_db database
spring.mongodb.uri=mongodb://localhost:27017/support_desk_db

# 2. Allow MongoDB to automatically create the unique email index for your AppUser
spring.mongodb.auto-index-creation=true

spring.output.ansi.enabled=always

# 3. Updated the logging package from assettracker to supportdesk!
logging.level.root=INFO
logging.level.com.example.supportdesk=DEBUG

spring.jackson.serialization.indent-output=true
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# Day 9 demo JWT settings.
# This is for classroom/demo use only. In real projects, keep secrets outside source code.
app.jwt.secret=${JWT_SECRET:day9-demo-secret-key-change-me-minimum-32-characters-2026}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
# export JWT_SECRET=your_secret_key
# export JWT_EXPIRATION_MINUTES=60